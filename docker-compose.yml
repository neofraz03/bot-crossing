version: '3.8'

services:
  bot-crossing:
    build: .
    container_name: bot-crossing-monitor
    restart: unless-stopped
    ports:
      - "5274:5274"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development